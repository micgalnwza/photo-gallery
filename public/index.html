<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork & Gallery Community</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div>
                <h1 class="logo-title">ART GALLERY</h1>
                <p class="logo-sub">ภาพวาด • การ์ตูน • แฟนอาร์ต • ภาพถ่าย</p>
            </div>
            <div id="authButtons" class="auth-box"></div>
        </div>
    </header>

    <main class="main-content" id="galleryFeed"></main>

    <!-- Modal: เข้าสู่ระบบ / สมัครสมาชิก -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-box modal-header-center">
            <h2 id="authTitle" class="modal-title">เข้าสู่ระบบ</h2>
            <p id="authSub" class="modal-subtitle">กรอกบัญชีผู้ใช้งานของคุณ</p>


            <form id="authForm">
                <div class="form-group">
                    <input type="text" id="authUsername" class="form-input" placeholder="ชื่อผู้ใช้ (Username)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="authPassword" class="form-input" placeholder="รหัสผ่าน (Password)" required>
                </div>
                <button type="submit" id="authSubmitBtn" class="btn-primary btn-full">เข้าสู่ระบบ</button>
            </form>

            <div class="auth-switch-text">
                <span id="authToggleText">ยังไม่มีบัญชี?</span> 
                <button type="button" onclick="toggleAuthMode()" class="btn-link btn-link-white" id="authToggleBtn">สมัครสมาชิก</button>
            </div>
            <button type="button" onclick="closeModal('authModal')" class="btn-link" style="margin-top: 10px;">ยกเลิก</button>
        </div>
    </div>

    <!-- Modal: ตั้งค่าโปรไฟล์ -->
    <div id="profileModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 class="modal-title">ตั้งค่าโปรไฟล์</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label class="form-label">เปลี่ยนชื่อผู้ใช้</label>
                    <input type="text" id="editUsername" class="form-input" placeholder="ชื่อใหม่...">
                </div>
                <div class="form-group">
                    <label class="form-label">เปลี่ยนรหัสผ่าน</label>
                    <input type="password" id="editPassword" class="form-input" placeholder="รหัสผ่านใหม่...">
                </div>
                <div class="form-group">
                    <label class="form-label">เปลี่ยนรูป Avatar</label>
                    <input type="file" id="editAvatarFile" accept="image/*" class="form-input">
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal('profileModal')" class="btn-link">ยกเลิก</button>
                    <button type="submit" id="profileSaveBtn" class="btn-primary">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: อัปโหลดภาพผลงาน -->
    <div id="uploadModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 class="modal-title">อัปโหลดผลงานรูปภาพ</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label class="form-label">ชื่อรูปภาพ / คำอธิบาย</label>
                    <input type="text" id="uploadTitle" class="form-input" placeholder="เช่น สเก็ตช์ตัวละคร, ภาพวิว" required>
                </div>
                <div class="form-group">
                    <label class="form-label">หมวดหมู่ผลงาน</label>
                    <select id="uploadCategory" class="form-select">
                        <option value="รูปวาด / ภาพประกอบ">รูปวาด / ภาพประกอบ</option>
                        <option value="การ์ตูน / อนิเมะ">การ์ตูน / อนิเมะ</option>
                        <option value="แฟนอาร์ต (Fanart)">แฟนอาร์ต (Fanart)</option>
                        <option value="ภาพถ่ายวิว / ธรรมชาติ">ภาพถ่ายวิว / ธรรมชาติ</option>
                        <option value="ทั่วไป">ทั่วไป</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">เลือกรูปภาพจากเครื่อง</label>
                    <input type="file" id="uploadFileInput" accept="image/*" class="form-input" required>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal('uploadModal')" class="btn-link">ยกเลิก</button>
                    <button type="submit" id="submitBtn" class="btn-primary">โพสต์ผลงาน</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let isRegister = false;

        function updateAuthUI() {
            const container = document.getElementById('authButtons');
            if (currentUser) {
                container.innerHTML = `
                    <div class="user-badge" onclick="openProfileModal()">
                        <img src="${currentUser.avatar}" class="avatar">
                        <span class="user-badge-name">${currentUser.username} ⚙️</span>
                    </div>
                    <button onclick="openModal('uploadModal')" class="btn-primary">+ โพสต์ภาพ</button>
                    <button onclick="logout()" class="btn-link">ออกจากระบบ</button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openModal('authModal')" class="btn-primary">เข้าสู่ระบบ</button>
                `;
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('authTitle').innerText = isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
            document.getElementById('authSub').innerText = isRegister ? 'สร้างบัญชีใหม่เพื่อเข้าใช้งาน' : 'กรอกบัญชีผู้ใช้งานของคุณ';
            document.getElementById('authSubmitBtn').innerText = isRegister ? 'ยืนยันการสมัคร' : 'เข้าสู่ระบบ';
            document.getElementById('authToggleText').innerText = isRegister ? 'มีบัญชีแล้ว?' : 'ยังไม่มีบัญชี?';
            document.getElementById('authToggleBtn').innerText = isRegister ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('user');
            updateAuthUI();
            fetchFeed();
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const endpoint = isRegister ? '/api/register' : '/api/login';
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                closeModal('authModal');
                document.getElementById('authForm').reset();
                updateAuthUI();
                fetchFeed();
            } else {
                alert(data.message);
            }
        });


        function openProfileModal() {
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editPassword').value = '';
            document.getElementById('editAvatarFile').value = '';
            openModal('profileModal');
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('profileSaveBtn');
            saveBtn.innerText = 'กำลังบันทึก...';
            saveBtn.disabled = true;

            const formData = new FormData();
            formData.append('user_id', currentUser.user_id);
            formData.append('new_username', document.getElementById('editUsername').value.trim());
            formData.append('new_password', document.getElementById('editPassword').value.trim());

            const avatarFile = document.getElementById('editAvatarFile').files[0];
            if (avatarFile) formData.append('avatar_file', avatarFile);

            try {
                const res = await fetch('/api/profile', { method: 'PUT', body: formData });
                const data = await res.json();
                if (res.ok) {
                    currentUser = data.user;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    alert('บันทึกข้อมูลเรียบร้อย');
                    closeModal('profileModal');
                    updateAuthUI();
                    fetchFeed();
                } else {
                    alert(data.message || 'บันทึกข้อมูลล้มเหลว');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            } finally {
                saveBtn.innerText = 'บันทึก';
                saveBtn.disabled = false;
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert('กรุณาเข้าสู่ระบบก่อน');

            const fileInput = document.getElementById('uploadFileInput');
            if (fileInput.files.length === 0) return alert('กรุณาเลือกไฟล์ภาพ');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'กำลังโพสต์...';
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('title', document.getElementById('uploadTitle').value);
            formData.append('category', document.getElementById('uploadCategory').value);
            formData.append('image_file', fileInput.files[0]);
            formData.append('user_id', currentUser.user_id);
            formData.append('author', currentUser.username);
            formData.append('avatar', currentUser.avatar);

            try {
                const res = await fetch('/api/artworks', { method: 'POST', body: formData });
                if (res.ok) {
                    closeModal('uploadModal');
                    document.getElementById('uploadForm').reset();
                    fetchFeed();
                } else {
                    alert('อัปโหลดล้มเหลว');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาด');
            } finally {
                submitBtn.innerText = 'โพสต์ผลงาน';
                submitBtn.disabled = false;
            }
        });

        async function fetchFeed() {
            try {
                const res = await fetch('/api/artworks', { cache: 'no-store' });
                const data = await res.json();
                const feed = document.getElementById('galleryFeed');

                if (!data || data.length === 0) {
                    feed.innerHTML = `<p class="empty-feed">ยังไม่มีผลงานรูปภาพ</p>`;
                    return;
                }

                feed.innerHTML = data.map(item => {
                    const isOwner = currentUser && String(currentUser.user_id) === String(item.user_id);

                    return `
                        <div class="card" id="artwork-card-${item.artwork_id}">
                            <div class="card-header">
                                <div class="user-meta">
                                    <img src="${item.avatar}" class="avatar">
                                    <div>
                                        <h3 class="art-title">${item.title}</h3>
                                        <p class="art-meta">โดย <b>@${item.author}</b> • <span class="tag">${item.category}</span></p>
                                    </div>
                                </div>
                                ${isOwner ? `
                                    <button onclick="deleteArtwork('${item.artwork_id}')" class="btn-link">🗑️ ลบโพสต์</button>
                                ` : ''}
                            </div>
                            <div class="image-container">
                                <img src="${item.image_url}" alt="${item.title}" class="post-image">
                            </div>
                            <div class="card-footer">
                                <div class="comments-list">
                                    ${item.comments && item.comments.length > 0 ? item.comments.map(c => {
                                        const isCommentOwner = currentUser && String(currentUser.user_id) === String(c.user_id);
                                        return `
                                        <div class="comment-row">
                                            <span class="comment-user">@${c.username}</span>: 
                                            <span class="comment-text">${c.text}</span>
                                            ${isCommentOwner ? `
                                                <button onclick="deleteComment('${item.artwork_id}', '${c.id}')" class="btn-link" style="font-size:10px;">ลบ</button>
                                            ` : ''}
                                        </div>
                                    `;
                                    }).join('') : '<p class="no-comment">ยังไม่มีความคิดเห็น</p>'}
                                </div>
                                ${currentUser ? `
                                    <form onsubmit="postComment(event, '${item.artwork_id}')" class="comment-form">
                                        <input type="text" id="comment-input-${item.artwork_id}" required placeholder="แสดงความคิดเห็นในชื่อ @${currentUser.username}..." class="comment-input">
                                        <button type="submit" class="btn-secondary">ส่ง</button>
                                    </form>
                                ` : `
                                    <p class="auth-notice">
                                        <a href="#" onclick="openModal('authModal')" class="btn-link-white">เข้าสู่ระบบ</a> เพื่อแสดงความคิดเห็น
                                    </p>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteArtwork(id) {
            if (!confirm('ต้องการลบโพสต์นี้หรือไม่?')) return;

            try {
                const res = await fetch('/api/artworks/' + id, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser ? currentUser.user_id : null })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    const el = document.getElementById('artwork-card-' + id);
                    if (el) el.remove();
                    await fetchFeed();
                } else {
                    alert(data.message || 'ลบโพสต์ไม่สำเร็จ');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการลบ');
            }
        }

        async function postComment(e, artworkId) {
            e.preventDefault();
            const input = document.getElementById(`comment-input-${artworkId}`);
            const text = input.value.trim();
            if (!text || !currentUser) return;

            await fetch(`/api/artworks/${artworkId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUser.username,
                    user_id: currentUser.user_id,
                    text
                })
            });

            input.value = '';
            fetchFeed();
        }

        async function deleteComment(artworkId, commentId) {
            if (!confirm('ต้องการลบคอมเมนต์นี้หรือไม่?')) return;

            try {
                const res = await fetch(`/api/artworks/${artworkId}/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser ? currentUser.user_id : null })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    fetchFeed();
                } else {
                    alert(data.message || 'ลบคอมเมนต์ไม่สำเร็จ');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการลบคอมเมนต์');
            }
        }

        updateAuthUI();
        fetchFeed();
    </script>
</body>
</html>
